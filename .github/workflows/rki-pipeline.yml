name: RKI transactional pipeline

on:
  workflow_call:
    inputs:
      dispatch_plan_b64:
        description: Canonical base64-encoded DispatchPlan JSON
        required: true
        type: string
      confirm_apply:
        description: Must equal APPLY before a commit can be pushed
        required: false
        default: ""
        type: string
    secrets:
      WACHHUND_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      dispatch_plan_b64:
        description: Canonical base64-encoded DispatchPlan JSON
        required: true
        type: string
      confirm_apply:
        description: Enter APPLY to permit a validated push
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: desinfect-repository-writer
  cancel-in-progress: false

jobs:
  pipeline:
    name: Validate and apply one repository transaction
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-docs.txt

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade "pip==26.1.2"
          python3 -m pip install "setuptools==83.0.0"
          python3 -m pip install -r requirements-test.txt -r requirements-docs.txt
          python3 -m pip check
          python3 -m pip install --no-deps --no-build-isolation --editable .
          npm ci --ignore-scripts

      - name: Install reviewed Poppler runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils
          command -v pdfinfo
          command -v pdftotext

      - name: Run focused P06 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_pdf_validation.py \
            tests/test_conversion.py \
            tests/test_conversion_service.py \
            tests/test_conversion_ocr.py \
            tests/test_manifests.py \
            tests/test_cli_entrypoints.py

      - name: Validate deterministic archive contracts
        run: |
          python -m pytest -q tests/test_archives.py
          python -m scripts.rki_pipeline.cli build-archive --fixture pilot --mode materialize
          python -m pytest -q tests/test_period_archives.py
          python -m scripts.rki_pipeline.cli aggregate --as-of 2026-01-01T05:00:00Z --mode plan

      - name: Decode and validate dispatch plan
        shell: bash
        env:
          DISPATCH_PLAN_B64: ${{ inputs.dispatch_plan_b64 }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/pipeline
          printf '%s' "$DISPATCH_PLAN_B64" | base64 --decode > build/pipeline/dispatch-plan.json
          python3 -m scripts.rki_pipeline.pipeline_cli validate-plan \
            --plan build/pipeline/dispatch-plan.json \
            > build/pipeline/validated-plan.json
          diff -u build/pipeline/dispatch-plan.json build/pipeline/validated-plan.json

      - name: Execute plan materialize validate apply transaction
        id: transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -m scripts.rki_pipeline.pipeline_cli execute \
            --plan build/pipeline/dispatch-plan.json \
            --repository-root . \
            --temp-root build/pipeline/temp \
            --now "$now" \
            --output build/pipeline/transaction-result.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path("build/pipeline/transaction-result.json").read_text())
          print(f"commit_required={str(payload['commit_required']).lower()}")
          print(f"run_status={payload['run_manifest']['status']}")
          PY

      - name: Run one global blocking validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_all_baseline.py
          python3 scripts/validate_p01_foundation.py
          python3 scripts/validate_p02_contracts.py
          python3 scripts/validate_p03_grabber.py
          python3 scripts/validate_p04_storage.py
          python3 scripts/validate_p05_dispatcher.py
          python3 scripts/validate_rights_register.py
          python3 scripts/validate_manifests.py --root tests/fixtures/manifests
          python3 scripts/validate_ci_mutation_safety.py
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m pytest -q
          npm test

      - name: Require explicit apply confirmation
        if: steps.transaction.outputs.commit_required == 'true'
        shell: bash
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -Eeuo pipefail
          if [[ "$CONFIRM_APPLY" != "APPLY" ]]; then
            echo "A repository write requires confirm_apply=APPLY" >&2
            exit 2
          fi

      - name: Build exact commit plan
        if: steps.transaction.outputs.commit_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed_paths < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("build/pipeline/transaction-result.json").read_text())
          for path in payload["changed_paths"]:
              print(path)
          PY
          )
          if (( ${#changed_paths[@]} == 0 )); then
            echo "Transaction claimed a commit without changed paths" >&2
            exit 2
          fi
          arguments=()
          for path in "${changed_paths[@]}"; do
            arguments+=(--path "$path")
          done
          python3 -m scripts.rki_pipeline.pipeline_cli build-commit-plan \
            --dispatch-plan build/pipeline/dispatch-plan.json \
            --repository-root . \
            "${arguments[@]}" \
            > build/pipeline/commit-plan.json

      - name: Stage exact paths and validate index
        id: stage
        if: steps.transaction.outputs.commit_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed_paths < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("build/pipeline/commit-plan.json").read_text())
          for entry in payload["entries"]:
              print(entry["path"])
          PY
          )
          git add -- "${changed_paths[@]}"
          python3 - <<'PY'
          from scripts.rki_pipeline.write_policy import validate_index
          validate_index()
          PY
          git status --short
          git diff --cached --name-status --no-renames
          if git diff --cached --quiet; then
            echo "has_staged=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_staged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create repository-scoped Wachhund token
        id: app-token
        if: steps.stage.outputs.has_staged == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WACHHUND_APP_CLIENT_ID }}
          private-key: ${{ secrets.WACHHUND_APP_PRIVATE_KEY }}
          owner: H234598
          repositories: desinfect
          permission-contents: write

      - name: Commit and push safely
        if: steps.stage.outputs.has_staged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_EMAIL: ${{ vars.WACHHUND_BOT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          set -Eeuo pipefail
          git status --short
          git diff --cached --name-status --no-renames
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Wachhund[bot]"
          git config user.email "$BOT_EMAIL"
          gh auth setup-git
          python3 -m scripts.rki_pipeline.pipeline_cli commit \
            --plan build/pipeline/commit-plan.json \
            --repository-root . \
            --push \
            --confirm-apply APPLY

      - name: Render redacted job summary
        id: observability
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          mkdir -p build/pipeline
          summary_path="build/pipeline/job-summary.md"
          if [[ -f build/pipeline/transaction-result.json ]] && \
             python3 -m scripts.rki_pipeline.ci_summary \
               build/pipeline/transaction-result.json \
               --status status.json \
               --job-status "${{ job.status }}" \
               --output "$summary_path" \
               --github-output "$GITHUB_OUTPUT"; then
            echo "summary_available=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' \
              '## RKI-Pipeline' \
              '' \
              '- Status: Diagnosemanifest nicht verfügbar' \
              '- Nächste sichere Aktion: fehlgeschlagenen Schritt und Artefakte prüfen' \
              > "$summary_path"
            echo "retention_days=90" >> "$GITHUB_OUTPUT"
            echo "summary_available=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted transaction evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rki-transaction-${{ github.run_id }}
          path: |
            build/pipeline/dispatch-plan.json
            build/pipeline/transaction-result.json
            build/pipeline/commit-plan.json
            build/pipeline/job-summary.md
          if-no-files-found: warn
          retention-days: ${{ steps.observability.outputs.retention_days || '90' }}

      - name: Create repository-scoped incident issue token
        id: incident-token
        if: always() && vars.ROLLING_ISSUE_ENABLED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WACHHUND_APP_CLIENT_ID }}
          private-key: ${{ secrets.WACHHUND_APP_PRIVATE_KEY }}
          owner: H234598
          repositories: desinfect
          permission-issues: write

      - name: Maintain rolling incident issue
        if: always() && vars.ROLLING_ISSUE_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.incident-token.outputs.token }}
          INCIDENT_FAILURE_THRESHOLD: ${{ vars.INCIDENT_FAILURE_THRESHOLD || '2' }}
        run: |
          arguments=(
            --mode apply
            --status status.json
            --job-status "${{ job.status }}"
            --threshold "$INCIDENT_FAILURE_THRESHOLD"
          )
          if [[ -f build/pipeline/transaction-result.json ]]; then
            arguments+=(--run-manifest build/pipeline/transaction-result.json)
          fi
          python3 -m scripts.rki_pipeline.incident_issue "${arguments[@]}"
