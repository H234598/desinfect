name: P00/P01/P02/P03/P04/P05 baseline

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
      - ".gitattributes"
      - "config/**"
      - "docs/**"
      - "research/**"
      - "runbooks/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "status.json"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "PROVENANCE.md"
      - "README.md"
      - "SECURITY.md"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements*.in"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
      - ".gitattributes"
      - "config/**"
      - "docs/**"
      - "research/**"
      - "runbooks/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "status.json"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "PROVENANCE.md"
      - "README.md"
      - "SECURITY.md"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements*.in"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p00-p05-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Validate governance and P01-P05 foundations
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-docs.txt

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify resolved Python locks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade "pip==26.1.2"
          mkdir -p build/dependency-reports
          lock_drift=0
          for kind in runtime test docs; do
            input="requirements.in"
            lock="requirements.txt"
            if [[ "$kind" != "runtime" ]]; then
              input="requirements-${kind}.in"
              lock="requirements-${kind}.txt"
            fi
            python3 -m pip install \
              --dry-run \
              --ignore-installed \
              --report "build/dependency-reports/${kind}.json" \
              -r "$input"
            python3 scripts/validate_dependency_locks.py \
              --render-report "build/dependency-reports/${kind}.json" \
              > "build/dependency-reports/${kind}.txt"
            python3 scripts/validate_dependency_locks.py \
              --verify-report "$kind" "build/dependency-reports/${kind}.json" \
              || lock_drift=1
            diff -u "$lock" "build/dependency-reports/${kind}.txt" || lock_drift=1
          done
          exit "$lock_drift"

      - name: Upload dependency resolver diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: p05-dependency-resolver-${{ github.run_id }}
          path: build/dependency-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Install locked Python and Node foundations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install "setuptools==83.0.0"
          python3 -m pip install -r requirements-test.txt -r requirements-docs.txt
          python3 -m pip check
          python3 -m pip install --no-deps --no-build-isolation --editable .
          npm ci --ignore-scripts

      - name: Install reviewed Poppler runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils
          command -v pdfinfo
          command -v pdftotext

      - name: Validate governance baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_all_baseline.py

      - name: Validate P01 foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p01_foundation.py

      - name: Validate P02 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p02_contracts.py

      - name: Validate P03 modular grabber
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p03_grabber.py

      - name: Validate P04 run modes and storage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p04_storage.py

      - name: Validate P05 dispatcher and transaction writer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p05_dispatcher.py

      - name: Validate rights register
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_rights_register.py

      - name: Validate P06 manifest catalog
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_manifests.py --root tests/fixtures/manifests

      - name: Validate CI mutation safety
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_ci_mutation_safety.py

      - name: Smoke-test runtime, grabber, storage, dispatcher, and pipeline CLIs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.rki_pipeline.runtime_status_cli --help
          python3 -m scripts.rki_grabber.rki_epidbull_grabber --help
          python3 -m scripts.rki_pipeline.storage_cli --help
          python3 -m scripts.rki_pipeline.dispatcher --help
          python3 -m scripts.rki_pipeline.pipeline_cli --help
          python3 -m scripts.rki_pipeline.cli convert --help

      - name: Run focused P06 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_pdf_validation.py \
            tests/test_conversion.py \
            tests/test_conversion_service.py \
            tests/test_conversion_ocr.py \
            tests/test_manifests.py \
            tests/test_cli_entrypoints.py

      - name: Run focused P05 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_due_tasks.py \
            tests/test_dispatch_plan.py \
            tests/test_dispatcher.py \
            tests/test_write_transaction.py \
            tests/test_commit_plan.py \
            tests/test_git_writer.py \
            tests/test_pipeline_cli.py \
            tests/test_p05_workflows.py \
            tests/test_ci_mutation_safety.py

      - name: Compile Python sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts tests

      - name: Run unittest suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run pytest suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q

      - name: Run Node foundation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test
