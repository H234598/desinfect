name: P00/P01/P02 baseline

on:
  pull_request:
    paths:
      - ".github/workflows/p00-baseline.yml"
      - ".github/CODEOWNERS"
      - "config/**"
      - "docs/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "status.json"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "PROVENANCE.md"
      - "README.md"
      - "SECURITY.md"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements*.in"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p00-baseline.yml"
      - ".github/CODEOWNERS"
      - "config/**"
      - "docs/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "status.json"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "PROVENANCE.md"
      - "README.md"
      - "SECURITY.md"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements*.in"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p00-p02-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Validate governance, P01 foundation, and P02 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-docs.txt

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify resolved Python locks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade "pip==26.1.2"
          mkdir -p build/dependency-reports
          lock_drift=0
          for kind in runtime test docs; do
            input="requirements.in"
            lock="requirements.txt"
            if [[ "$kind" != "runtime" ]]; then
              input="requirements-${kind}.in"
              lock="requirements-${kind}.txt"
            fi
            python3 -m pip install \
              --dry-run \
              --ignore-installed \
              --report "build/dependency-reports/${kind}.json" \
              -r "$input"
            python3 scripts/validate_dependency_locks.py \
              --render-report "build/dependency-reports/${kind}.json" \
              > "build/dependency-reports/${kind}.txt"
            python3 scripts/validate_dependency_locks.py \
              --verify-report "$kind" "build/dependency-reports/${kind}.json" \
              || lock_drift=1
            diff -u "$lock" "build/dependency-reports/${kind}.txt" || lock_drift=1
          done
          exit "$lock_drift"

      - name: Upload dependency resolver diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p02-dependency-resolver-${{ github.run_id }}
          path: build/dependency-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Install locked Python and Node foundations
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install "setuptools==83.0.0"
          python3 -m pip install -r requirements-test.txt -r requirements-docs.txt
          python3 -m pip check
          python3 -m pip install --no-deps --no-build-isolation --editable .
          npm ci --ignore-scripts

      - name: Validate governance baseline
        id: governance
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_all_baseline.py

      - name: Validate P01 foundation
        id: p01
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p01_foundation.py

      - name: Validate P02 contracts
        id: p02
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_p02_contracts.py

      - name: Smoke-test runtime status CLI
        id: runtime_cli
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.rki_pipeline.runtime_status_cli --help

      - name: Compile Python sources
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts tests

      - name: Run unittest suite
        id: unittest
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run pytest suite
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q

      - name: Run Node foundation tests
        id: node
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test

      - name: Enforce all validation gates
        if: always()
        shell: bash
        env:
          GOVERNANCE: ${{ steps.governance.outcome }}
          P01: ${{ steps.p01.outcome }}
          P02: ${{ steps.p02.outcome }}
          RUNTIME_CLI: ${{ steps.runtime_cli.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          UNITTEST: ${{ steps.unittest.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
          NODE: ${{ steps.node.outcome }}
        run: |
          set -Eeuo pipefail
          {
            echo "## P00/P01/P02 validation gates"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| Governance | ${GOVERNANCE} |"
            echo "| P01 | ${P01} |"
            echo "| P02 | ${P02} |"
            echo "| Runtime CLI | ${RUNTIME_CLI} |"
            echo "| Compile | ${COMPILE} |"
            echo "| Unittest | ${UNITTEST} |"
            echo "| Pytest | ${PYTEST} |"
            echo "| Node | ${NODE} |"
          } >> "$GITHUB_STEP_SUMMARY"
          failures=0
          for outcome in \
            "$GOVERNANCE" "$P01" "$P02" "$RUNTIME_CLI" \
            "$COMPILE" "$UNITTEST" "$PYTEST" "$NODE"; do
            [[ "$outcome" == "success" ]] || failures=$((failures + 1))
          done
          if (( failures > 0 )); then
            echo "${failures} validation gate(s) failed" >&2
            exit 1
          fi
