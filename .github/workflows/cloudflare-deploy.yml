name: Cloudflare Watchdog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy production after same-run staging health check
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Worker without deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/watchdog/package-lock.json
      - name: Install locked Worker dependencies
        run: npm --prefix cloudflare/watchdog ci --ignore-scripts
      - name: Validate bounded Cloudflare configuration
        run: python3 scripts/validate_cloudflare_config.py
      - name: Test and typecheck Worker
        run: |
          npm --prefix cloudflare/watchdog test
          npm --prefix cloudflare/watchdog run typecheck
          npm --prefix cloudflare/watchdog run types:check
      - name: Build deployment without publishing
        run: npm --prefix cloudflare/watchdog run deploy:dry-run

  deploy_staging:
    name: Deploy and verify staging
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 15m global readiness deadline plus fixed reserve for checkout, npm, deploy, VPN, and cleanup.
    timeout-minutes: 25
    concurrency:
      group: cloudflare-watchdog-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-watchdog-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/watchdog/package-lock.json
      - name: Install locked Worker dependencies
        run: npm --prefix cloudflare/watchdog ci --ignore-scripts
      - name: Deploy staging without cron
        run: npm --prefix cloudflare/watchdog run deploy -- --env staging --var "DEPLOYMENT_VERSION:${GITHUB_SHA}"
      - name: Install OpenVPN for VPN health verification
        run: |
          if ! command -v openvpn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes openvpn
          fi
      - name: Verify deployed health and version through VPN
        env:
          EXPECTED_VERSION: ${{ github.sha }}
          WATCHDOG_HEALTH_URL: ${{ secrets.CLOUDFLARE_WATCHDOG_HEALTH_URL }}
          VPN_CONFIG_DE: ${{ secrets.CLOUDFLARE_HEALTH_VPN_DE_CONFIG }}
          VPN_CONFIG_NL: ${{ secrets.CLOUDFLARE_HEALTH_VPN_NL_CONFIG }}
          VPN_CONFIG_CH: ${{ secrets.CLOUDFLARE_HEALTH_VPN_CH_CONFIG }}
          VPN_AUTH: ${{ secrets.CLOUDFLARE_HEALTH_VPN_AUTH }}
          VPN_PROVISIONING_DEADLINE_SECONDS: "900"
          VPN_PROVISIONING_RETRY_INTERVAL_SECONDS: "15"
        run: sh scripts/verify_cloudflare_health_via_vpn.sh --url "$WATCHDOG_HEALTH_URL" --expected-version "$EXPECTED_VERSION"

  deploy_production:
    name: Deploy and verify production
    needs: [validate, deploy_staging]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production
    runs-on: ubuntu-24.04
    # 15m global readiness deadline plus fixed reserve for checkout, npm, deploy, VPN, and cleanup.
    timeout-minutes: 25
    concurrency:
      group: cloudflare-watchdog-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-watchdog-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/watchdog/package-lock.json
      - name: Install locked Worker dependencies
        run: npm --prefix cloudflare/watchdog ci --ignore-scripts
      - name: Deploy production with cron
        run: npm --prefix cloudflare/watchdog run deploy -- --env="" --var "DEPLOYMENT_VERSION:${GITHUB_SHA}"
      - name: Install OpenVPN for VPN health verification
        run: |
          if ! command -v openvpn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes openvpn
          fi
      - name: Verify deployed health and version through VPN
        env:
          EXPECTED_VERSION: ${{ github.sha }}
          WATCHDOG_HEALTH_URL: ${{ secrets.CLOUDFLARE_WATCHDOG_HEALTH_URL }}
          VPN_CONFIG_DE: ${{ secrets.CLOUDFLARE_HEALTH_VPN_DE_CONFIG }}
          VPN_CONFIG_NL: ${{ secrets.CLOUDFLARE_HEALTH_VPN_NL_CONFIG }}
          VPN_CONFIG_CH: ${{ secrets.CLOUDFLARE_HEALTH_VPN_CH_CONFIG }}
          VPN_AUTH: ${{ secrets.CLOUDFLARE_HEALTH_VPN_AUTH }}
          VPN_PROVISIONING_DEADLINE_SECONDS: "900"
          VPN_PROVISIONING_RETRY_INTERVAL_SECONDS: "15"
        run: sh scripts/verify_cloudflare_health_via_vpn.sh --url "$WATCHDOG_HEALTH_URL" --expected-version "$EXPECTED_VERSION"
