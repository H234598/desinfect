name: RKI bounded backfill

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: First historical year
        required: true
        default: "1994"
        type: string
      to_year:
        description: Last historical year
        required: true
        default: "2020"
        type: string
      max_tasks:
        description: Hard maximum number of year tasks
        required: true
        default: "27"
        type: string
      run_mode:
        description: Pipeline run mode
        required: true
        default: plan
        type: choice
        options:
          - plan
          - materialize
          - apply
      confirm_apply:
        description: Enter APPLY only for run_mode=apply
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Build bounded historical dispatch plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dispatch_plan_b64: ${{ steps.plan.outputs.dispatch_plan_b64 }}
    steps:
      - name: Checkout main read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade "pip==26.1.2"
          python3 -m pip install "setuptools==83.0.0"
          python3 -m pip install -r requirements.txt
          python3 -m pip install --no-deps --no-build-isolation --editable .

      - name: Validate explicit apply confirmation
        if: inputs.run_mode == 'apply'
        shell: bash
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -Eeuo pipefail
          if [[ "$CONFIRM_APPLY" != "APPLY" ]]; then
            echo "Backfill apply requires confirm_apply=APPLY" >&2
            exit 2
          fi

      - name: Build canonical backfill plan
        id: plan
        shell: bash
        env:
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
          MAX_TASKS: ${{ inputs.max_tasks }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: |
          set -Eeuo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base_sha="$(git rev-parse HEAD)"
          python3 -m scripts.rki_pipeline.dispatcher \
            --config config/dispatcher.toml \
            --now "$now" \
            --base-sha "$base_sha" \
            --run-mode "$RUN_MODE" \
            --storage-backend lfs \
            backfill \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --max-tasks "$MAX_TASKS" \
            > dispatch-plan.json
          python3 -m scripts.rki_pipeline.pipeline_cli validate-plan \
            --plan dispatch-plan.json \
            > validated-plan.json
          diff -u dispatch-plan.json validated-plan.json
          encoded="$(base64 -w0 dispatch-plan.json)"
          echo "dispatch_plan_b64=$encoded" >> "$GITHUB_OUTPUT"

  pipeline:
    name: Execute bounded backfill transaction
    needs: plan
    uses: ./.github/workflows/rki-pipeline.yml
    with:
      dispatch_plan_b64: ${{ needs.plan.outputs.dispatch_plan_b64 }}
      confirm_apply: ${{ inputs.confirm_apply }}
    secrets:
      WACHHUND_APP_PRIVATE_KEY: ${{ secrets.WACHHUND_APP_PRIVATE_KEY }}
