[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desinfect"
version = "0.1.0"
description = "Reproducible RKI bulletin archive, conversion, monitoring, and publication pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "CC0-1.0"}
authors = [{name = "H234598"}]
dependencies = [
  "beautifulsoup4==4.15.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
test = [
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "pytest-socket==0.8.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "pymdown-extensions==11.0.1",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "scripts.*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --disable-socket"
testpaths = ["tests"]
markers = [
  "network: explicit integration test that requires DESINFECT_ALLOW_NETWORK_TESTS=1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
